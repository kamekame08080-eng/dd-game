<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D．D｜ユニットガチャ</title>
<style>
* { box-sizing: border-box; }
body { margin:0; padding:24px 16px 48px; background:#171b2b; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif; text-align:center; }
h1 { font-size:42px; margin:12px 0 4px; letter-spacing:2px; }
.subtitle { color:#c5c9d8; margin:0 0 26px; }
.machines { display:flex; flex-direction:column; gap:16px; max-width:420px; margin:auto; }
.machine { padding:20px; border-radius:18px; background:#292f46; border:2px solid #59617d; }
.machine h2 { margin:0 0 12px; font-size:21px; }
.capsule { width:66px; height:66px; border-radius:50%; margin:8px auto 16px; border:4px solid white; box-shadow:inset -7px -7px 0 #0002,0 4px 10px #0005; }
.lv1 { background:#2588ed; } .lv2 { background:#35bd75; } .lv3 { background:#ed9a32; }
button { padding:12px 28px; border:0; border-radius:25px; background:#f5d36b; color:#222; font-size:16px; font-weight:bold; cursor:pointer; }
button:disabled { opacity:.55; cursor:wait; }
#quantity-area,#message { margin:22px auto; padding:18px; max-width:420px; background:#292f46; border-radius:14px; }
#quantity-area label { display:block; margin-bottom:10px; }
#quantity { width:100%; accent-color:#f5d36b; }
#quantity-value { color:#f5d36b; font-weight:bold; }
#message { min-height:60px; color:#dce1f2; }
#results { max-width:640px; margin:20px auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
.unit { text-align:left; padding:14px; background:#292f46; border:1px solid #59617d; border-radius:14px; overflow:hidden; }
.unit h3 { margin:0 0 8px; color:#f5d36b; }
.unit img { display:block; width:100%; max-height:220px; object-fit:contain; border-radius:10px; margin:8px auto; background:#20263a; }
.unit p { white-space:pre-wrap; line-height:1.6; color:#e0e4ef; }
.small { color:#aeb6ce; font-size:12px; }

#admin-area { max-width:640px; margin:28px auto; padding:18px; background:#222940; border:1px solid #59617d; border-radius:14px; text-align:left; }
#admin-area h2 { margin-top:0; text-align:center; }
#admin-area input,#admin-area select,#admin-area textarea { width:100%; margin:6px 0 12px; padding:11px; border-radius:8px; border:1px solid #707b9a; background:#171b2b; color:#fff; font:inherit; }
#admin-area textarea { min-height:76px; }
#admin-area button { margin:5px 4px 5px 0; }
#admin-status { color:#f5d36b; white-space:pre-wrap; }
.admin-unit { padding:12px; margin:10px 0; border:1px solid #59617d; border-radius:10px; }
.admin-unit button { padding:8px 14px; font-size:14px; }
#admin-toggle { margin:20px auto; background:#59617d; color:#fff; }

</style>
</head>
<body>
<h1>D．D</h1>
<p class="subtitle">ユニットガチャ</p>

<div class="machines">
  <div class="machine">
    <h2>LEVEL 1</h2><div class="capsule lv1"></div>
    <button class="draw-button" onclick="draw(1)">LEVEL 1 を回す</button>
  </div>
  <div class="machine">
    <h2>LEVEL 2</h2><div class="capsule lv2"></div>
    <button class="draw-button" onclick="draw(2)">LEVEL 2 を回す</button>
  </div>
  <div class="machine">
    <h2>LEVEL 3</h2><div class="capsule lv3"></div>
    <button class="draw-button" onclick="draw(3)">LEVEL 3 を回す</button>
  </div>
</div>

<div id="quantity-area">
  <label for="quantity">今回引くユニット数：<span id="quantity-value">1</span>体</label>
  <input id="quantity" type="range" min="1" max="4" value="1" oninput="document.getElementById('quantity-value').textContent=this.value">
</div>
<div id="message">レベルを選んでガチャを回してください！</div>
<div id="results" aria-live="polite"></div>
<p class="small">ユニットの情報はオンラインデータベースから読み込みます。</p>


<button id="admin-toggle" type="button" onclick="toggleAdmin()">管理者メニュー</button>
<section id="admin-area" hidden>
  <h2>D．D 管理者メニュー</h2>
  <div id="admin-login">
    <p>管理者アカウントでログインしてください。</p>
    <label for="admin-email">メールアドレス</label>
    <input id="admin-email" type="email" autocomplete="username" placeholder="登録したメールアドレス">
    <label for="admin-password">パスワード</label>
    <input id="admin-password" type="password" autocomplete="current-password" placeholder="パスワード">
    <button type="button" onclick="adminLogin()">ログイン</button>
    <p id="admin-status" role="status"></p>
  </div>
  <div id="admin-tools" hidden>
    <p>ユニットの追加・編集・削除</p>
    <label for="unit-name">ユニット名</label>
    <input id="unit-name" placeholder="例：スライム">
    <label for="unit-level">レベル</label>
    <select id="unit-level"><option value="1">LEVEL 1</option><option value="2">LEVEL 2</option><option value="3">LEVEL 3</option></select>
    <label for="unit-description">説明</label>
    <textarea id="unit-description" placeholder="ユニットの説明"></textarea>
    <label for="unit-image">画像URL（任意）</label>
    <input id="unit-image" type="url" placeholder="Supabaseの公開画像URL">
    <input id="unit-id" type="hidden">
    <button type="button" onclick="saveUnit()">ユニットを登録</button>
    <button type="button" onclick="resetUnitForm()">入力をクリア</button>
    <button type="button" onclick="adminLogout()">ログアウト</button>
    <h3>登録済みユニット</h3>
    <div id="admin-unit-list"></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ddmiwtrdsrevqajbjrgx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_YTD-Q9dckugZjxvEG3I1DA_dy14gKPg";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function showUnits(units, level) {
  const results = document.getElementById("results");
  results.replaceChildren();
  units.forEach((unit, index) => {
    const card = document.createElement("article");
    card.className = "unit";
    const heading = document.createElement("h3");
    heading.textContent = "カプセル " + (index + 1) + "｜" + (unit.name || "名前未設定");
    card.appendChild(heading);
    const levelText = document.createElement("div");
    levelText.className = "small";
    levelText.textContent = "LEVEL " + level;
    card.appendChild(levelText);
    if (unit.image_url) {
      const img = document.createElement("img");
      img.src = unit.image_url;
      img.alt = unit.name || "ユニット画像";
      img.loading = "lazy";
      card.appendChild(img);
    }
    const description = document.createElement("p");
    description.textContent = unit.description || "説明はまだ登録されていません。";
    card.appendChild(description);
    results.appendChild(card);
  });
}

async function draw(level) {
  const buttons = [...document.querySelectorAll(".draw-button")];
  const message = document.getElementById("message");
  const results = document.getElementById("results");
  const count = Number(document.getElementById("quantity").value);
  buttons.forEach(button => button.disabled = true);
  results.replaceChildren();
  message.textContent = "カプセルを準備しています…";
  try {
    const request = db
      .from("units")
      .select("id,name,level,image_url,description")
      .eq("level", level);
    const timeout = new Promise((_, reject) =>
      setTimeout(() => reject(new Error("データベースからの応答がありません。時間をおいて再度お試しください。")), 12000)
    );
    const { data, error } = await Promise.race([request, timeout]);
    if (error) throw error;
    if (!data || data.length === 0) {
      message.textContent = "LEVEL " + level + " のユニットは、まだ登録されていません。";
      return;
    }
    if (data.length < count) {
      message.textContent = "このレベルの登録ユニットは " + data.length + " 体です。引く数を " + data.length + " 体以下にしてください。";
      return;
    }
    await new Promise(resolve => setTimeout(resolve, 900));
    const selected = shuffle(data).slice(0, count);
    showUnits(selected, level);
    message.textContent = "LEVEL " + level + " のカプセルが " + selected.length + " 個出ました！";
  } catch (error) {
    console.error("D.D Supabase error:", error);
    const detail = error && error.message ? error.message : String(error);
    message.textContent = "読み込みエラー：" + detail;
  } finally {
    buttons.forEach(button => button.disabled = false);
  }
}

function toggleAdmin() {
  const area = document.getElementById("admin-area");
  area.hidden = !area.hidden;
}
async function adminLogin() {
  const status = document.getElementById("admin-status");
  status.textContent = "ログインしています…";
  try {
    const { data, error } = await db.auth.signInWithPassword({
      email: document.getElementById("admin-email").value.trim(),
      password: document.getElementById("admin-password").value
    });
    if (error) { status.textContent = "ログインエラー：" + error.message; return; }
    const { data: admin, error: adminError } = await db.from("admin_users").select("user_id").eq("user_id", data.user.id).maybeSingle();
    if (adminError || !admin) {
      await db.auth.signOut();
      status.textContent = adminError ? "管理者確認エラー：" + adminError.message : "このアカウントは管理者として登録されていません。";
      return;
    }
    document.getElementById("admin-login").hidden = true;
    document.getElementById("admin-tools").hidden = false;
    status.textContent = "管理者としてログインしました。";
    await loadAdminUnits();
  } catch (error) {
    console.error("D.D admin login error:", error);
    status.textContent = "通信エラー：" + (error && error.message ? error.message : String(error));
  }
}
async function adminLogout() {
  await db.auth.signOut();
  document.getElementById("admin-login").hidden = false;
  document.getElementById("admin-tools").hidden = true;
  document.getElementById("admin-password").value = "";
  document.getElementById("admin-status").textContent = "ログアウトしました。";
}
function resetUnitForm() {
  document.getElementById("unit-id").value = "";
  document.getElementById("unit-name").value = "";
  document.getElementById("unit-level").value = "1";
  document.getElementById("unit-description").value = "";
  document.getElementById("unit-image").value = "";
}
async function saveUnit() {
  const status = document.getElementById("admin-status");
  const id = document.getElementById("unit-id").value;
  const name = document.getElementById("unit-name").value.trim();
  const level = Number(document.getElementById("unit-level").value);
  const description = document.getElementById("unit-description").value.trim();
  const image_url = document.getElementById("unit-image").value.trim() || null;
  if (!name) { status.textContent = "ユニット名を入力してください。"; return; }
  status.textContent = "保存しています…";
  const values = { name, level, description, image_url };
  const result = id
    ? await db.from("units").update(values).eq("id", id)
    : await db.from("units").insert(values);
  if (result.error) { status.textContent = "保存エラー：" + result.error.message; return; }
  status.textContent = id ? "ユニットを更新しました。" : "ユニットを登録しました。";
  resetUnitForm();
  await loadAdminUnits();
}
async function loadAdminUnits() {
  const list = document.getElementById("admin-unit-list");
  list.textContent = "読み込み中…";
  const { data, error } = await db.from("units").select("id,name,level,description,image_url").order("level").order("name");
  if (error) { list.textContent = "読み込みエラー：" + error.message; return; }
  list.replaceChildren();
  if (!data.length) { list.textContent = "登録済みユニットはありません。"; return; }
  data.forEach(unit => {
    const item = document.createElement("div");
    item.className = "admin-unit";
    const title = document.createElement("strong");
    title.textContent = "LEVEL " + unit.level + "｜" + unit.name;
    item.appendChild(title);
    const desc = document.createElement("p");
    desc.textContent = unit.description || "説明なし";
    item.appendChild(desc);
    const edit = document.createElement("button");
    edit.type = "button"; edit.textContent = "編集";
    edit.onclick = () => {
      document.getElementById("unit-id").value = unit.id;
      document.getElementById("unit-name").value = unit.name || "";
      document.getElementById("unit-level").value = String(unit.level);
      document.getElementById("unit-description").value = unit.description || "";
      document.getElementById("unit-image").value = unit.image_url || "";
      document.getElementById("admin-status").textContent = "編集内容を入力欄に読み込みました。";
      document.getElementById("unit-name").scrollIntoView({behavior:"smooth",block:"center"});
    };
    item.appendChild(edit);
    const del = document.createElement("button");
    del.type = "button"; del.textContent = "削除";
    del.onclick = async () => {
      if (!confirm("「" + unit.name + "」を削除しますか？")) return;
      const { error: deleteError } = await db.from("units").delete().eq("id", unit.id);
      if (deleteError) { document.getElementById("admin-status").textContent = "削除エラー：" + deleteError.message; return; }
      document.getElementById("admin-status").textContent = "ユニットを削除しました。";
      await loadAdminUnits();
    };
    item.appendChild(del);
    list.appendChild(item);
  });
}

</script>
</body>
</html>
